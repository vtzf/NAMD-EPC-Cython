[main]
# Fermi energy(Hatree)
Ef         =  -0.247267
nq         = [40,40,40]                       
nmodes     = 18                                 
nbands     = 4                                  
# phonon energy cutoff(eV)
ph_cutoff  = 0.0005                             
Ispin      = 1
spin       = up
inDir      = .
bandDir    = epc_band
phononDir  = phonon
epcDir     = epc_all
valname    = band_val_k.npy
phvalname  = val.npy
basselname = bassel.npy
epcname    = epc_all.dat

[lambda]
# Guassain smearing (eV)
sigma      = 0.04       
# DOS at Ef (1/eV/spin)
Nef        = 1.84345375                         
# width of Fermi surface (eV)
fthick     = 0.4                                


[Sigma]
# k mesh(must be an integer multiple of nq)
nk         = [200,40,40]                       
#Temperature(K)
T          = 20
bmin       = 2                                  
bmax       = 2               
# life time parameter (eV)
delta      = 0.003                              

[a2f]
# Gaussian smearing (meV)
sigma      = 0.5
# Coulomb pseudopotential
mu         = 0.0
# number of frequency points
nw         = 500


